[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execbench"
version = "0.1.0"
description = "A deterministic evaluation environment for AI executive agents"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3", "numpy>=1.26", "pyyaml>=6", "typer>=0.12", "jinja2>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
execbench = "execbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["execbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
